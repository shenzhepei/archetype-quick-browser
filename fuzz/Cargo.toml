[package]
name = "archetype-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arch-css = { path = "../crates/arch-css" }
arch-html = { path = "../crates/arch-html" }
libfuzzer-sys = "0.4"

[[bin]]
name = "html"
path = "fuzz_targets/html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "css"
path = "fuzz_targets/css.rs"
test = false
doc = false
bench = false
