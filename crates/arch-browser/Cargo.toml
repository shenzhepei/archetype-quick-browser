[package]
name = "arch-browser"
default-run = "arch-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
archetype-protocol = { path = "../archetype-protocol" }
archetype-raster = { path = "../archetype-raster" }
archetype-sdk = { path = "../archetype-sdk", features = ["internal-runtime-client"] }
archetype-types = { path = "../archetype-types" }
arch-css = { path = "../arch-css" }
arch-dom = { path = "../arch-dom" }
arch-html = { path = "../arch-html" }
arch-layout = { path = "../arch-layout" }
arch-net = { path = "../arch-net" }
arch-paint = { path = "../arch-paint" }
arch-session = { path = "../arch-session" }
arch-store = { path = "../arch-store" }
arch-style = { path = "../arch-style" }
chacha20poly1305.workspace = true
cosmic-text.workspace = true
directories.workspace = true
fontdb.workspace = true
getrandom.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sys-locale.workspace = true
thiserror.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.5.1"
security-framework-sys = "=2.15.0"

[lints]
workspace = true

[[bin]]
name = "arch-browser"
path = "src/main.rs"

[[bin]]
name = "arch-profile-probe"
path = "src/bin/profile_probe.rs"

[[bin]]
name = "arch-v3-acceptance"
path = "src/bin/v3_acceptance.rs"

[[bin]]
name = "arch-v4-acceptance"
path = "src/bin/v4_acceptance.rs"
