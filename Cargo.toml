[workspace]
resolver = "2"
members = [
  "crates/archetype-protocol",
  "crates/archetype-runtime",
  "crates/archetype-types",
  "crates/arch-browser",
  "crates/arch-css",
  "crates/arch-dom",
  "crates/arch-html",
  "crates/arch-layout",
  "crates/arch-net",
  "crates/arch-paint",
  "crates/arch-session",
  "crates/arch-store",
  "crates/arch-style",
  "crates/archetype-sdk",
  "crates/archetype-raster",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chacha20poly1305 = "0.10"
cssparser = "0.37"
cosmic-text = "0.14.2"
cookie = "0.18"
cookie_store = "=0.22.0"
fontdb = "0.16.2"
futures-executor = "0.3"
getrandom = "0.3"
html5ever = "0.35"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
directories = "6.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
markup5ever_rcdom = "0.39"
psl = "2.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2.0"
sys-locale = "0.3"
url = "2.5"
uuid = { version = "1.11", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
