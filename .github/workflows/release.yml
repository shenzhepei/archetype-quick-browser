name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.13-bookworm
        env:
          POSTGRES_DB: archetype
          POSTGRES_USER: archetype
          POSTGRES_PASSWORD: archetype
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archetype -d archetype"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: demo
          MYSQL_USER: demo
          MYSQL_PASSWORD: demo
          MYSQL_ROOT_PASSWORD: root-demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot-demo"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          root_version="$(node -p "require('./package.json').version")"
          browser_version="$(node -p "require('./apps/browser/package.json').version")"
          test "$version" = "$root_version"
          test "$version" = "$browser_version"
      - run: pnpm typecheck
      - run: pnpm release:coverage
        env:
          RUN_INTEGRATION_TESTS: '1'
          TEST_PLATFORM_POSTGRES_URL: postgres://archetype:archetype@localhost:5432/archetype
          TEST_POSTGRES_URL: postgres://archetype:archetype@localhost:5432/archetype
          TEST_MYSQL_URL: mysql://demo:demo@localhost:3306/demo
      - run: test -s coverage/lcov.info
      - run: pnpm docs:check
      - run: pnpm build

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact: windows-x64
            command: pnpm package:win:x64
          - os: macos-15
            artifact: macos-arm64
            command: pnpm package:mac:arm64
          - os: macos-15-intel
            artifact: macos-x64
            command: pnpm package:mac:x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build unsigned installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 3

  release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Validate names and create checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "Archetype-Runtime-${version}-windows-x64-setup.exe"
            "Archetype-Runtime-${version}-macos-arm64.dmg"
            "Archetype-Runtime-${version}-macos-arm64.zip"
            "Archetype-Runtime-${version}-macos-x64.dmg"
            "Archetype-Runtime-${version}-macos-x64.zip"
          )
          for file in "${expected[@]}"; do test -s "release-assets/$file"; done
          cd release-assets
          sha256sum "${expected[@]}" > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --notes "These installers are unsigned and not notarized. Windows SmartScreen and macOS Gatekeeper may show an unknown publisher warning. No system security bypass is provided." \
            --title "Archetype Runtime ${GITHUB_REF_NAME#v}"
