name: Fuzz

on:
  push:
  pull_request:

jobs:
  parser-fuzz:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - run: cargo fuzz run html -- -max_total_time=20 -timeout=5
      - run: cargo fuzz run css -- -max_total_time=20 -timeout=5
