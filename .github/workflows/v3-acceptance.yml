name: V3 Acceptance

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Stability-loop duration in seconds
        required: true
        default: "7200"
      startup_samples:
        description: Fresh-profile desktop startup samples
        required: true
        default: "20"

jobs:
  acceptance:
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --bins
      - run: >-
          ./target/release/arch-v3-acceptance
          --duration-seconds ${{ inputs.duration_seconds }}
          --cycle-delay-milliseconds 1000
          --startup-samples ${{ inputs.startup_samples }}
          --output artifacts/v3-acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: v3-acceptance-${{ github.sha }}
          path: artifacts/v3-acceptance.json
          if-no-files-found: error
