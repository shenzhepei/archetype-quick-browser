name: V5 Acceptance

on:
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p archetype-sdk --no-deps
      - run: scripts/verify_sdk_compatibility.sh
      - run: cargo build -p archetype-runtime --bin archetype-runtime
      - name: Run partner SDK example
        run: >-
          cargo run -p archetype-sdk --example partner_render --
          target/debug/archetype-runtime artifacts/sdk-partner.png
      - name: Verify Runtime sandbox and entitlements
        run: |
          cargo build -p archetype-runtime --bin archetype-sandbox-probe
          cargo build --release -p arch-browser --bin arch-browser
          cargo build --release -p archetype-runtime --bin archetype-runtime
          scripts/verify_runtime_sandbox.sh
          scripts/verify_runtime_entitlements.sh
      - run: cargo run -p arch-browser --example update_license_inventory
      - run: git diff --exit-code -- THIRD_PARTY_LICENSES.md
      - uses: actions/upload-artifact@v4
        with:
          name: v5-sdk-example-${{ github.sha }}
          path: artifacts/sdk-partner.png
          if-no-files-found: error
