name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
        env:
          DOCS_BASE: /archetype-runtime-browser/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed page and asset
        shell: bash
        run: |
          set -euo pipefail
          page_url="${{ steps.deployment.outputs.page_url }}"
          for attempt in {1..20}; do
            html="$(curl --fail --silent --show-error --location "${page_url}" || true)"
            asset="$(printf '%s' "$html" | grep -Eo 'assets/[^" ]+\.(js|css)' | head -n 1 || true)"
            if [ -n "$html" ] && [ -n "$asset" ] && curl --fail --silent --show-error --head "${page_url}${asset}" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1
