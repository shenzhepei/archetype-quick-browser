version: 2
updates:
  # Workspace members inherit dependency versions from the root manifest.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  # cargo-fuzz requires an independent manifest outside the workspace.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
