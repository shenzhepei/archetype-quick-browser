name: Bug report
description: Report a reproducible Archetype problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove passwords, tokens, private URLs, and personal data before submitting.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open...\n2. Navigate...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Archetype version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
