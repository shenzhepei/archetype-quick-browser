<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Child selector fixture</title>
    <style>
      section > p { color: #2457c5; margin: 12px; }
      section div p { color: #207a3c; }
    </style>
  </head>
  <body>
    <section>
      <p>Direct child selector target.</p>
      <div><p>Nested descendant remains independently styled.</p></div>
    </section>
  </body>
</html>
