<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Cascade fixture</title>
    <style>
      p { color: blue; margin: 4px; }
      .notice { color: green; }
      #important { color: red !important; }
    </style>
  </head>
  <body>
    <p>Type selector</p>
    <p class="notice">Class selector</p>
    <p id="important" class="notice">ID and important selector</p>
  </body>
</html>
