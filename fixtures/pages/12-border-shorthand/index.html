<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Border shorthand fixture</title>
    <style>
      .panel {
        width: 420px;
        margin: 16px;
        padding: 20px;
        border: 4px solid #2457c5;
        background-color: #eef4ff;
        box-sizing: border-box;
      }
      .reset { border: none; }
    </style>
  </head>
  <body>
    <section class="panel">
      <h1>Border shorthand</h1>
      <p>The shorthand controls the solid border width and color.</p>
    </section>
    <p class="reset">This paragraph has no border.</p>
  </body>
</html>
