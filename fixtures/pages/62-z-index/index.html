<!doctype html>
<title>V6 stable z index</title>
<style>
  main { position: relative; width: 500px; height: 220px }
  div { position: absolute; width: 240px; height: 100px; padding: 12px }
  .back { left: 20px; top: 20px; z-index: -1; background-color: #c53030 }
  .middle { left: 80px; top: 60px; z-index: 1; background-color: #2468ac; color: white }
  .front { left: 140px; top: 100px; z-index: 2; background-color: green; color: white }
</style>
<main><div class="front">Front layer</div><div class="back">Back layer</div><div class="middle">Middle layer</div></main>
