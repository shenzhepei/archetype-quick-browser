<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Inheritance fixture</title>
    <style>
      article { color: #17325c; font-size: 18px; line-height: 1.6; }
      .override { color: #b42318; }
    </style>
  </head>
  <body>
    <article>
      <h1>Inherited typography</h1>
      <p>Nested text inherits color, size, and line height.</p>
      <p class="override">A child declaration overrides only its color.</p>
    </article>
  </body>
</html>
