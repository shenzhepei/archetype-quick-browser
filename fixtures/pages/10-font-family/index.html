<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Font family fixture</title>
    <style>
      body { font-family: "Helvetica Neue", sans-serif; }
      .override { font-family: Courier New, monospace; }
    </style>
  </head>
  <body>
    <h1>Inherited font family</h1>
    <p>This paragraph inherits the quoted family.</p>
    <p class="override">This paragraph uses an unquoted family.</p>
  </body>
</html>
