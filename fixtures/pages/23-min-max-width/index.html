<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Min max width fixture</title>
    <style>
      .minimum { width: 120px; min-width: 280px; background-color: #eef4ff; }
      .maximum { width: 600px; max-width: 360px; background-color: #ecfdf3; }
      .minimum, .maximum { margin: 12px; padding: 12px; }
    </style>
  </head>
  <body>
    <div class="minimum">Minimum width expands this box.</div>
    <div class="maximum">Maximum width constrains this box.</div>
  </body>
</html>
