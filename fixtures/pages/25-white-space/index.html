<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>White space fixture</title>
    <style>
      pre { white-space: pre; color: #2457c5; }
      .normal { white-space: normal; width: 320px; }
    </style>
  </head>
  <body>
    <pre>alpha
  beta
    gamma</pre>
    <p class="normal">Normal white space collapses repeated spaces and wraps this sentence.</p>
  </body>
</html>
