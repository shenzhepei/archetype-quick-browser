<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Box sizing fixture</title>
    <style>
      .content-box { width: 300px; padding: 20px; border: 4px solid #2457c5; background-color: #eef4ff; }
      .border-box { width: 300px; padding: 20px; border: 4px solid #207a3c; background-color: #ecfdf3; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div class="content-box"><p>Content box expands beyond the declared width.</p></div>
    <div class="border-box"><p>Border box retains the declared outer width.</p></div>
  </body>
</html>
