<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Typography fixture</title>
    <style>
      h1 { text-align: center; }
      .end { text-align: right; font-style: italic; }
      pre { color: #2457c5; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1>Centered heading</h1>
    <p class="end">Right aligned italic text</p>
    <pre>alpha
  beta
    gamma</pre>
  </body>
</html>
