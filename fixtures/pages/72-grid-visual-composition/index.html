<!doctype html>
<title>V7 grid visual composition</title>
<style>
  main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; width: 900px }
  article { height: 130px; padding: 18px; border-radius: 16px; background: #eef4ff; box-shadow: 4px 6px 10px #0008 }
  .muted { opacity: .55 }
  .done { text-decoration: line-through }
</style>
<main><article>Active card</article><article class="muted">Muted card</article><article class="done">Completed card</article></main>
