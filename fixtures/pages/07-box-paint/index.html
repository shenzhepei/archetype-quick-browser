<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Box paint fixture</title>
    <style>
      .panel {
        width: 420px;
        margin: 16px;
        padding: 20px;
        border-width: 3px;
        border-color: #2457c5;
        background-color: #eef4ff;
        box-sizing: border-box;
      }
      .panel p { color: #17325c; line-height: 1.6; }
    </style>
  </head>
  <body>
    <section class="panel">
      <h1>Painted box</h1>
      <p>The background and border contain this nested text.</p>
    </section>
  </body>
</html>
